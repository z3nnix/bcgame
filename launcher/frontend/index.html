<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betacraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="banner-wrap">
      <img id="logo" alt="Betacraft">
      <span id="title" hidden>Betacraft</span>
    </div>

    <div id="profile-row">
      <label for="nick">Nickname</label>
      <input id="nick" type="text" placeholder="Player" autocomplete="off" spellcheck="false">
    </div>

    <div id="worlds-panel">
      <div class="panel-head">Worlds</div>
      <div id="worlds-list">
        <ul id="worlds"></ul>
        <p id="empty" hidden>No worlds yet. Create one!</p>
      </div>
      <div id="world-btns">
        <button id="create" class="mc-btn">Create world</button>
        <button id="delete" class="mc-btn" disabled>Delete</button>
      </div>
    </div>

    <footer>
      <div id="action-row">
        <button id="play" class="mc-btn play">&#9654;&nbsp; Play</button>
        <button id="open-folder" class="mc-btn icon-btn" title="Open folder" aria-label="Open folder">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
          </svg>
        </button>
        <button id="update-check" class="mc-btn icon-btn" title="Check for updates" aria-label="Check for updates">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Create world dialog -->
  <div id="dialog-overlay" class="overlay" hidden>
    <div class="dialog">
      <h2>Create new world</h2>
      <div class="form">
        <label for="world-name">Name</label>
        <input id="world-name" type="text" placeholder="New World" autocomplete="off" spellcheck="false">
        <label for="world-seed">Seed</label>
        <input id="world-seed" type="text" placeholder="(empty = random)" autocomplete="off" spellcheck="false">
      </div>
      <div class="dlg-btns">
        <button id="dialog-cancel" class="mc-btn">Cancel</button>
        <button id="dialog-ok" class="mc-btn play">Create</button>
      </div>
    </div>
  </div>

  <!-- Confirm delete dialog -->
  <div id="confirm-overlay" class="overlay" hidden>
    <div class="dialog">
      <h2>Delete world</h2>
      <p id="confirm-text" class="muted">Delete &laquo;&hellip;&raquo;?</p>
      <div class="dlg-btns">
        <button id="confirm-cancel" class="mc-btn">Cancel</button>
        <button id="confirm-ok" class="mc-btn danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Update dialog -->
  <div id="update-overlay" class="overlay" hidden>
    <div class="dialog">
      <h2 id="update-title">Update available</h2>
      <p id="update-text"></p>
      <div id="update-progress-wrap" class="progress-wrap" hidden>
        <progress id="update-progress" max="100" value="0"></progress>
        <span id="update-progress-text" class="muted"></span>
      </div>
      <div class="dlg-btns">
        <button id="update-later" class="mc-btn">Later</button>
        <button id="update-now" class="mc-btn play">Update now</button>
        <button id="update-ok" class="mc-btn play" hidden>OK</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
