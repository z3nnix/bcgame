name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. v0.1.0)
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        default: ''
        type: string
      draft:
        description: Create the release as a draft
        required: false
        default: true
        type: boolean
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: Linux (glibc) package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build engine (Linux, run-in-place)
        env:
          CONTAINER_RUNTIME: docker
          RUN_IN_PLACE: 1
        run: ./engine/build.sh

      - name: Build Discord RPC companion (Linux)
        run: ./tools/discord_rpc/build.sh linux

      - name: Assemble game folder
        run: |
          set -euo pipefail
          SRC=.staging/betacraft
          rm -rf .staging
          mkdir -p "$SRC/bin" "$SRC/worlds/default"
          # Engine: binary + data
          cp -v engine/install/bin/luanti "$SRC/bin/luanti"
          cp -r engine/install/share/luanti/builtin engine/install/share/luanti/fonts \
                engine/install/share/luanti/textures engine/install/share/luanti/client "$SRC"/
          # Game content
          cp -r mods textures menu "$SRC"/
          cp game.conf settingtypes.txt minetest.conf "$SRC"/
          # Docs
          cp LICENSE "$SRC"/
          cp docs/CREDITS.md docs/LEGAL.md "$SRC"/
          # Starter world + launcher
          cp packaging/worlds/default/world.mt "$SRC/worlds/default/world.mt"
          cp packaging/start.sh "$SRC/start.sh"
          chmod +x "$SRC/start.sh"
          # Keep only the Linux Discord RPC companion
          rm -f "$SRC/mods/CORE/mcl_discord_rpc/bin/discord_rpc.exe"
          # Cleanup
          find "$SRC" -name '*~' -delete
          find "$SRC" -name '*.kra' -delete

      - name: Create archive
        run: |
          cd .staging
          zip -qr betacraft-linux-x86_64.zip betacraft

      - uses: actions/upload-artifact@v4
        with:
          name: betacraft-linux
          path: .staging/betacraft-linux-x86_64.zip
          if-no-files-found: error

  windows-package:
    name: Windows package
    runs-on: windows-2025
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Restore from cache and run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}\vcpkg'
          vcpkgJsonGlob: 'engine/luanti/vcpkg.json'

      - name: Build engine (Windows, MSVC, run-in-place)
        shell: pwsh
        run: |
          ./engine/build_windows.ps1 -VcpkgDir "$env:GITHUB_WORKSPACE\vcpkg"

      - name: Build Discord RPC companion (Windows)
        shell: bash
        run: ./tools/discord_rpc/build.sh windows

      - name: Assemble game folder
        shell: pwsh
        run: |
          $src = '.staging\betacraft'
          Remove-Item -Recurse -Force .staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$src\bin", "$src\worlds\default" | Out-Null
          # Engine: binary + DLLs + data
          Copy-Item engine\stage-windows\bin\* $src\bin -Recurse
          Copy-Item engine\stage-windows\share\luanti\builtin, engine\stage-windows\share\luanti\fonts, engine\stage-windows\share\luanti\textures, engine\stage-windows\share\luanti\client $src -Recurse
          # Game content
          Copy-Item mods, textures, menu $src -Recurse
          Copy-Item game.conf, settingtypes.txt, minetest.conf $src
          # Docs
          Copy-Item LICENSE $src
          Copy-Item docs\CREDITS.md, docs\LEGAL.md $src
          # Starter world + launcher
          Copy-Item packaging\worlds\default\world.mt $src\worlds\default\world.mt
          Copy-Item packaging\start.cmd $src\start.cmd
          # Keep only the Windows Discord RPC companion
          Remove-Item "$src\mods\CORE\mcl_discord_rpc\bin\discord_rpc" -Force
          # Cleanup
          Get-ChildItem -Path $src -Recurse -Filter '*~' | Remove-Item -Force
          Get-ChildItem -Path $src -Recurse -Filter '*.kra' | Remove-Item -Force

      - name: Create archive
        shell: pwsh
        run: |
          Push-Location .staging
          tar -a -c -f betacraft-windows-x86_64.zip betacraft
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: betacraft-windows
          path: .staging/betacraft-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux-package, windows-package]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Create release
        run: |
          cd release
          args=(--title "Betacraft ${{ inputs.version }}" --notes "${{ inputs.notes }}")
          if [ "${{ inputs.draft }}" = "true" ]; then args+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          gh release create "${{ inputs.version }}" "${args[@]}" betacraft-*.zip