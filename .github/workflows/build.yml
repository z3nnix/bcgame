name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: Linux (glibc) package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install webkit2gtk (launcher window)
        run: |
          # Ubuntu 24.04 GitHub runners route apt through a mirrorlist
          # (mirror+file:/etc/apt/apt-mirrors.txt) pointing at the Azure
          # mirrors, which are often unreachable and hang the update.
          # Point straight at the public archive and drop azure mirrors.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources || true
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build Discord RPC companion (Linux)
        run: ./tools/discord_rpc/build.sh linux

      - name: Build launcher (Linux)
        run: ./launcher/build.sh linux

      - name: Assemble game folder
        run: |
          set -euo pipefail
          SRC=.staging/betacraft
          rm -rf .staging
          mkdir -p "$SRC/bin" "$SRC/worlds/default"
          # Game content (creates mods/, textures/, menu/)
          cp -r mods textures menu "$SRC"/
          cp game.conf settingtypes.txt minetest.conf "$SRC"/
          # Engine: binary (committed run-in-place install tree)
          cp -v engine/install/bin/luanti "$SRC/bin/luanti"
          # Engine data (run-in-place installs data in the prefix root)
          cp -r engine/install/builtin engine/install/fonts engine/install/client "$SRC"/
          cp -r engine/install/textures/base "$SRC/textures/"
          # Docs
          cp LICENSE "$SRC"/
          cp docs/CREDITS.md docs/LEGAL.md "$SRC"/
          # Starter world + launcher (launcher sits at the game root)
          cp packaging/worlds/default/world.mt "$SRC/worlds/default/world.mt"
          cp launcher/bin/launcher "$SRC/launcher"
          chmod +x "$SRC/launcher"
          # Keep only the Linux Discord RPC companion
          rm -f "$SRC/mods/CORE/mcl_discord_rpc/bin/discord_rpc.exe"
          # Cleanup
          find "$SRC" -name '*~' -delete
          find "$SRC" -name '*.kra' -delete

      - name: Create archive
        run: |
          cd .staging
          zip -qr betacraft-linux-x86_64.zip betacraft

      - uses: actions/upload-artifact@v4
        with:
          name: betacraft-linux
          path: .staging/betacraft-linux-x86_64.zip
          if-no-files-found: error

  windows-package:
    name: Windows package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build Discord RPC companion (Windows)
        run: ./tools/discord_rpc/build.sh windows

      - name: Build launcher (Windows)
        run: ./launcher/build.sh windows

      - name: Assemble game folder
        run: |
          set -euo pipefail
          SRC=.staging/betacraft
          rm -rf .staging
          mkdir -p "$SRC/bin" "$SRC/worlds/default"
          # Game content (creates mods/, textures/, menu/)
          cp -r mods textures menu "$SRC"/
          cp game.conf settingtypes.txt minetest.conf "$SRC"/
          # Engine: binary + DLLs (committed run-in-place install tree)
          cp -r engine/install-win64/bin/* "$SRC/bin/"
          # Engine data (run-in-place installs data in the prefix root)
          cp -r engine/install-win64/builtin engine/install-win64/fonts engine/install-win64/client "$SRC"/
          cp -r engine/install-win64/textures/base "$SRC/textures/"
          # Docs
          cp LICENSE "$SRC"/
          cp docs/CREDITS.md docs/LEGAL.md "$SRC"/
          # Starter world + launcher (launcher sits at the game root)
          cp packaging/worlds/default/world.mt "$SRC/worlds/default/world.mt"
          cp launcher/bin/launcher.exe "$SRC/launcher.exe"
          # Keep only the Windows Discord RPC companion
          rm -f "$SRC/mods/CORE/mcl_discord_rpc/bin/discord_rpc"
          # Cleanup
          find "$SRC" -name '*~' -delete
          find "$SRC" -name '*.kra' -delete

      - name: Create archive
        run: |
          cd .staging
          zip -qr betacraft-windows-x86_64.zip betacraft

      - uses: actions/upload-artifact@v4
        with:
          name: betacraft-windows
          path: .staging/betacraft-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux-package, windows-package]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Create release
        run: |
          cd release
          TAG="v$(date +%Y.%m.%d)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
          fi
          gh release create "$TAG" --title "Betacraft $TAG" \
            --repo "$GITHUB_REPOSITORY" betacraft-*.zip