name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. v0.1.0)
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        default: ''
        type: string
      draft:
        description: Create the release as a draft
        required: false
        default: true
        type: boolean
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: Linux (glibc) package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build Discord RPC companion (Linux)
        run: ./tools/discord_rpc/build.sh linux

      - name: Assemble game folder
        run: |
          set -euo pipefail
          SRC=.staging/betacraft
          rm -rf .staging
          mkdir -p "$SRC/bin" "$SRC/worlds/default"
          # Game content (creates mods/, textures/, menu/)
          cp -r mods textures menu "$SRC"/
          cp game.conf settingtypes.txt minetest.conf "$SRC"/
          # Engine: binary (committed run-in-place install tree)
          cp -v engine/install/bin/luanti "$SRC/bin/luanti"
          # Engine data (run-in-place installs data in the prefix root)
          cp -r engine/install/builtin engine/install/fonts engine/install/client "$SRC"/
          cp -r engine/install/textures/base "$SRC/textures/"
          # Docs
          cp LICENSE "$SRC"/
          cp docs/CREDITS.md docs/LEGAL.md "$SRC"/
          # Starter world + launcher
          cp packaging/worlds/default/world.mt "$SRC/worlds/default/world.mt"
          cp packaging/start.sh "$SRC/start.sh"
          chmod +x "$SRC/start.sh"
          # Keep only the Linux Discord RPC companion
          rm -f "$SRC/mods/CORE/mcl_discord_rpc/bin/discord_rpc.exe"
          # Cleanup
          find "$SRC" -name '*~' -delete
          find "$SRC" -name '*.kra' -delete

      - name: Create archive
        run: |
          cd .staging
          zip -qr betacraft-linux-x86_64.zip betacraft

      - uses: actions/upload-artifact@v4
        with:
          name: betacraft-linux
          path: .staging/betacraft-linux-x86_64.zip
          if-no-files-found: error

  windows-package:
    name: Windows package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build Discord RPC companion (Windows)
        run: ./tools/discord_rpc/build.sh windows

      - name: Assemble game folder
        run: |
          set -euo pipefail
          SRC=.staging/betacraft
          rm -rf .staging
          mkdir -p "$SRC/bin" "$SRC/worlds/default"
          # Game content (creates mods/, textures/, menu/)
          cp -r mods textures menu "$SRC"/
          cp game.conf settingtypes.txt minetest.conf "$SRC"/
          # Engine: binary + DLLs (committed run-in-place install tree)
          cp -r engine/install-win64/bin/* "$SRC/bin/"
          # Engine data (run-in-place installs data in the prefix root)
          cp -r engine/install-win64/builtin engine/install-win64/fonts engine/install-win64/client "$SRC"/
          cp -r engine/install-win64/textures/base "$SRC/textures/"
          # Docs
          cp LICENSE "$SRC"/
          cp docs/CREDITS.md docs/LEGAL.md "$SRC"/
          # Starter world + launcher
          cp packaging/worlds/default/world.mt "$SRC/worlds/default/world.mt"
          cp packaging/start.cmd "$SRC/start.cmd"
          # Keep only the Windows Discord RPC companion
          rm -f "$SRC/mods/CORE/mcl_discord_rpc/bin/discord_rpc"
          # Cleanup
          find "$SRC" -name '*~' -delete
          find "$SRC" -name '*.kra' -delete

      - name: Create archive
        run: |
          cd .staging
          zip -qr betacraft-windows-x86_64.zip betacraft

      - uses: actions/upload-artifact@v4
        with:
          name: betacraft-windows
          path: .staging/betacraft-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux-package, windows-package]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Create release
        run: |
          cd release
          args=(--title "Betacraft ${{ inputs.version }}" --notes "${{ inputs.notes }}")
          if [ "${{ inputs.draft }}" = "true" ]; then args+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          gh release create "${{ inputs.version }}" "${args[@]}" betacraft-*.zip